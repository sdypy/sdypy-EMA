name: Create a Release on Tag

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: Install dependencies
      run: pip install build tomli tomli-w

    # Optional (run a python script to sync versions with the tag)
    - name: Extract tag version
      id: tag
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Set version from tag
      run: python sync_version.py --set-version ${{ steps.tag.outputs.version }}

    - name: Check if there are changes
      id: diff
      run: |
        if git diff --quiet; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit version sync (if needed)
      if: steps.diff.outputs.changed == 'true'
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git commit -am "sync version to ${{ steps.tag.outputs.version }}"
        git push origin HEAD:main
    # ---

    - name: Build distribution
      run: python -m build

    - name: Create GitHub Release and upload artifacts
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.whl

    - name: Store the distribution for publishing
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  # Trusted Publishing: PyPI accepts a short-lived OIDC token from this job, no API token secret.
  # PyPI side: sdypy-EMA > Settings > Publishing, with this workflow file and environment "pypi".
  publish:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sdypy-EMA
    permissions:
      id-token: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
