[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "sdypy-EMA"
version = "0.30.0"
authors = [
    { name = "Janko Slavič et al.", email = "janko.slavic@fs.uni-lj.si" },
]
maintainers = [
    { name = "Janko Slavič et al.", email = "janko.slavic@fs.uni-lj.si" },
]
license = "MIT"
description = "Experimental and operational modal analysis."
readme = "README.rst"
keywords = [
    "EMA",
    "OMA",
    "Experimental Modal Analysis",
    "Structural Dynamics",
]
requires-python = ">=3.10"
dependencies = [
    "tqdm>=4.23.4",
    "numpy>=1.14.3",
    "matplotlib>=3.3.1",
    "scipy>=1.1.0",
    "pyuff>=2.1",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "sphinx-copybutton>=0.5.2",
]
dev = [
    "sdypy-EMA[docs]",
    "twine",
    "wheel",
    "pytest",
    "build",
    "pyLump",
    "flake8",
]

[project.urls]
homepage = "https://github.com/sdypy/sdypy-EMA"
documentation = "https://sdypy-EMA.readthedocs.io/en/latest/index.html"
source = "https://github.com/sdypy/sdypy-EMA"

[tool.hatch.build.targets.wheel]
packages = ["sdypy"]

[tool.hatch.build.targets.sdist]
include = [
    "sdypy/",
    "tests/",
    "docs/",
    "README.rst",
    "LICENSE",
    "pyproject.toml",
    "readthedocs.yaml",
]
exclude = [
    "docs/_build",
    "docs/**/_build",
    "data/",
]
